{% extends "base.html" %}

{% block title %}Forgot password — CIRCLO{% endblock %}

{% block content %}
<div class="mx-auto max-w-[460px] px-4 py-14 sm:py-20">
  <div class="rounded-3xl border border-divider bg-surface p-[26px] shadow-circlo sm:p-[30px]">
    <div class="mb-3.5 text-[12px] tracking-[0.14em] uppercase text-accent-700">Account recovery</div>
    <h1 class="m-0 font-display text-[32px] font-bold uppercase leading-[0.95] tracking-[-0.01em] text-ink sm:text-[38px]">Reset your password</h1>
    <p class="mt-2 text-[15px] leading-[1.6] text-neutral-700">Enter the email your account is registered under and we'll send you a reset link.</p>

    <form method="post" action="{{ url_for('web.forgot_password') }}" class="mt-6 flex flex-col gap-3">
      <div>
        <label for="email" class="mb-1.5 block text-sm font-bold text-ink">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"
               class="w-full rounded-full border border-divider bg-white px-4 py-[11px] text-[15px] text-ink placeholder:text-neutral-500 focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-100"
               placeholder="you@example.com">
      </div>
      <button type="submit"
              class="mt-1.5 h-[52px] w-full rounded-full bg-accent font-display text-[19px] font-bold uppercase tracking-[0.08em] text-white hover:bg-accent-600 focus:outline-none focus:ring-2 focus:ring-accent-100">
        Send reset link
      </button>
    </form>

    <div class="mt-[18px] border-t border-divider pt-4 text-[13px] text-neutral-700">
      <a href="{{ url_for('web.login') }}" class="font-semibold text-accent-700 hover:text-accent-800">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
