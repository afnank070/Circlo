{% extends "base.html" %}

{% block title %}Log in — CIRCLO{% endblock %}

{% block content %}
<div class="mx-auto flex max-w-md flex-col px-4 py-10 sm:py-14">
  <div class="rounded-2xl border border-sand-200 bg-white p-6 shadow-sm sm:p-8">
    <div class="mb-6 text-center">
      <span class="mx-auto grid h-11 w-11 place-items-center rounded-full bg-navy-800">
        <span class="h-4 w-4 rounded-full border-2 border-white"></span>
      </span>
      <h1 class="mt-4 font-sora text-2xl font-extrabold tracking-tight text-navy-900">Welcome back</h1>
      <p class="mt-1 text-sm text-navy-700/70">Log in to manage your listings.</p>
    </div>

    <form method="post" action="{{ url_for('web.login') }}" class="space-y-4">
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div>
        <label for="email" class="block text-sm font-semibold text-navy-800">Email</label>
        <input id="email" name="email" type="email" value="{{ email }}" required autocomplete="email"
               class="mt-1.5 w-full rounded-xl border border-sand-200 bg-sand-50 px-3.5 py-2.5 text-sm text-navy-900
                      placeholder:text-navy-700/40 focus:border-teal-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-100"
               placeholder="you@example.com">
      </div>
      <div>
        <div class="flex items-baseline justify-between">
          <label for="password" class="block text-sm font-semibold text-navy-800">Password</label>
          <a href="{{ url_for('web.forgot_password') }}" class="text-xs font-semibold text-teal-700 hover:text-teal-800">Forgot password?</a>
        </div>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               class="mt-1.5 w-full rounded-xl border border-sand-200 bg-sand-50 px-3.5 py-2.5 text-sm text-navy-900
                      placeholder:text-navy-700/40 focus:border-teal-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-100"
               placeholder="Your password">
      </div>

      <button type="submit"
              class="w-full rounded-xl bg-navy-800 px-5 py-3 text-sm font-semibold text-white shadow-sm hover:bg-navy-900 focus:outline-none focus:ring-2 focus:ring-navy-100">
        Log in
      </button>
    </form>

    {% if google_oauth_enabled %}
    <div class="my-5 flex items-center gap-3">
      <span class="h-px flex-1 bg-sand-200"></span>
      <span class="text-xs font-medium uppercase tracking-wide text-navy-700/50">or</span>
      <span class="h-px flex-1 bg-sand-200"></span>
    </div>
    <a href="{{ url_for('web.google_login', next=next) if next else url_for('web.google_login') }}"
       class="flex w-full items-center justify-center gap-3 rounded-xl border border-sand-200 bg-white px-5 py-3 text-sm font-semibold text-navy-800 shadow-sm hover:bg-sand-50 focus:outline-none focus:ring-2 focus:ring-teal-100">
      <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.57c2.08-1.92 3.27-4.74 3.27-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.76c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 0 1 0-4.18V7.07H2.18a11 11 0 0 0 0 9.86l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
      </svg>
      Sign in with Google
    </a>
    {% endif %}

    <p class="mt-5 text-center text-sm text-navy-700/70">
      New to CIRCLO?
      <a href="{{ url_for('web.signup') }}" class="font-semibold text-teal-700 hover:text-teal-800">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
