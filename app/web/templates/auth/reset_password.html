{% extends "base.html" %}

{% block title %}Choose a new password — CIRCLO{% endblock %}

{% block content %}
<div class="mx-auto max-w-[460px] px-4 py-14 sm:py-20">
  <div class="rounded-3xl border border-divider bg-surface p-[26px] shadow-circlo sm:p-[30px]">
    <div class="mb-3.5 text-[12px] tracking-[0.14em] uppercase text-accent-700">Account recovery</div>
    <h1 class="m-0 font-display text-[32px] font-bold uppercase leading-[0.95] tracking-[-0.01em] text-ink sm:text-[38px]">Choose a new password</h1>
    <p class="mt-2 text-[15px] leading-[1.6] text-neutral-700">This link works once and expires an hour after it was sent.</p>

    <form method="post" action="{{ url_for('web.reset_password', token=token) }}" class="mt-6 flex flex-col gap-3">
      <div>
        <label for="password" class="mb-1.5 block text-sm font-bold text-ink">New password</label>
        <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8"
               class="w-full rounded-full border border-divider bg-white px-4 py-[11px] text-[15px] text-ink placeholder:text-neutral-500 focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-100"
               placeholder="At least 8 characters">
      </div>
      <div>
        <label for="confirm" class="mb-1.5 block text-sm font-bold text-ink">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" required autocomplete="new-password" minlength="8"
               class="w-full rounded-full border border-divider bg-white px-4 py-[11px] text-[15px] text-ink placeholder:text-neutral-500 focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-100"
               placeholder="Re-type it">
      </div>
      <button type="submit"
              class="mt-1.5 h-[52px] w-full rounded-full bg-accent font-display text-[19px] font-bold uppercase tracking-[0.08em] text-white hover:bg-accent-600 focus:outline-none focus:ring-2 focus:ring-accent-100">
        Update password
      </button>
    </form>

    <div class="mt-[18px] border-t border-divider pt-4 text-[13px] text-neutral-700">
      <a href="{{ url_for('web.login') }}" class="font-semibold text-accent-700 hover:text-accent-800">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
