{% extends "base.html" %}

{% block title %}Choose a new password — CIRCLO{% endblock %}

{% block content %}
<div class="mx-auto flex max-w-md flex-col px-4 py-10 sm:py-14">
  <div class="rounded-2xl border border-sand-200 bg-white p-6 shadow-sm sm:p-8">
    <div class="mb-6 text-center">
      <span class="mx-auto grid h-11 w-11 place-items-center rounded-full bg-navy-800">
        <span class="h-4 w-4 rounded-full border-2 border-white"></span>
      </span>
      <h1 class="mt-4 font-sora text-2xl font-extrabold tracking-tight text-navy-900">Choose a new password</h1>
      <p class="mt-1 text-sm text-navy-700/70">This link works once and expires an hour after it was sent.</p>
    </div>

    <form method="post" action="{{ url_for('web.reset_password', token=token) }}" class="space-y-4">
      <div>
        <label for="password" class="block text-sm font-semibold text-navy-800">New password</label>
        <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8"
               class="mt-1.5 w-full rounded-xl border border-sand-200 bg-sand-50 px-3.5 py-2.5 text-sm text-navy-900
                      focus:border-teal-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-100"
               placeholder="At least 8 characters">
      </div>
      <div>
        <label for="confirm" class="block text-sm font-semibold text-navy-800">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" required autocomplete="new-password" minlength="8"
               class="mt-1.5 w-full rounded-xl border border-sand-200 bg-sand-50 px-3.5 py-2.5 text-sm text-navy-900
                      focus:border-teal-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-100"
               placeholder="Re-type it">
      </div>
      <button type="submit"
              class="w-full rounded-xl bg-navy-800 px-5 py-3 text-sm font-semibold text-white shadow-sm hover:bg-navy-900 focus:outline-none focus:ring-2 focus:ring-navy-100">
        Update password
      </button>
    </form>
  </div>
</div>
{% endblock %}
