{% extends "base.html" %}

{% block title %}Change password — CIRCLO{% endblock %}

{% block content %}
<div class="mx-auto max-w-[760px] px-4 py-12 sm:px-14 sm:py-16">
  <h1 class="m-0 font-display text-[32px] font-bold uppercase leading-none tracking-[-0.01em] text-ink sm:text-[36px]">Change password</h1>
  <p class="mt-3 text-sm text-neutral-700">Enter your current password, then choose a new one.</p>

  <form method="post" action="{{ url_for('web.change_password') }}" class="mt-8 grid gap-4 sm:max-w-md">
    <label class="block">
      <span class="text-xs font-bold uppercase tracking-[0.06em] text-neutral-600">Current password</span>
      <input type="password" name="current_password" required autocomplete="current-password"
             class="mt-1 w-full rounded-full border border-divider bg-white px-4 py-2 text-sm text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-100">
    </label>
    <label class="block">
      <span class="text-xs font-bold uppercase tracking-[0.06em] text-neutral-600">New password</span>
      <input type="password" name="new_password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters"
             class="mt-1 w-full rounded-full border border-divider bg-white px-4 py-2 text-sm text-ink placeholder:text-neutral-500 focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-100">
    </label>
    <label class="block">
      <span class="text-xs font-bold uppercase tracking-[0.06em] text-neutral-600">Confirm new password</span>
      <input type="password" name="confirm" required autocomplete="new-password" minlength="8" placeholder="Re-type it"
             class="mt-1 w-full rounded-full border border-divider bg-white px-4 py-2 text-sm text-ink placeholder:text-neutral-500 focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-100">
    </label>
    <div class="flex items-center gap-3">
      <button type="submit" class="rounded-full bg-accent-700 px-5 py-2 text-sm font-bold text-white hover:bg-accent-800">Update password</button>
      <a href="{{ url_for('web.user_profile', user_id=current_user.id) }}" class="text-sm font-semibold text-neutral-600 hover:text-ink">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
