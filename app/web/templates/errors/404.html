{% extends "base.html" %}

{% block title %}Page not found — CIRCLO{% endblock %}

{% block content %}
<div class="mx-auto flex max-w-[560px] flex-col items-center px-4 py-20 text-center sm:py-28">
  <span class="grid h-16 w-16 place-items-center rounded-[18px] bg-accent-100 text-accent-700">
    <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M11 8v3M11 14h.01"/></svg>
  </span>
  <p class="mt-6 font-display text-[64px] font-bold uppercase leading-none text-ink sm:text-[80px]">404</p>
  <h1 class="mt-2 font-display text-[24px] font-bold uppercase tracking-[-0.01em] text-ink">Page not found</h1>
  <p class="mt-2 max-w-[42ch] text-[15px] leading-[1.6] text-neutral-700">
    The page you're after has moved or never existed. The listing may also have been taken down by its owner.
  </p>
  <a href="{{ url_for('web.index') }}"
     class="mt-7 inline-flex h-[52px] items-center rounded-full bg-accent px-7 font-display text-[17px] font-bold uppercase tracking-[0.08em] text-white hover:bg-accent-600">
    Back to browse
  </a>
</div>
{% endblock %}
