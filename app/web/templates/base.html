<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CIRCLO{% endblock %}</title>

  <!-- Tailwind (CDN for MVP — build tooling comes later, per blueprint §3) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX for dynamic interactions without a heavy SPA -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto max-w-7xl px-4 py-4 flex items-center justify-between">
      <a href="{{ url_for('web.index') }}" class="flex items-center gap-2 text-xl font-bold tracking-tight text-slate-900">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-emerald-600 text-white text-sm">C</span>
        CIRCLO
      </a>
      <span class="inline-flex items-center gap-1.5 text-sm text-slate-500">
        <svg class="h-4 w-4 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>
        Islamabad &amp; Rawalpindi
      </span>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="mx-auto max-w-7xl px-4 py-8 text-sm text-slate-400">
    &copy; {{ 2026 }} CIRCLO — peer-to-peer rentals for the twin cities.
  </footer>
</body>
</html>
