<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CIRCLO{% endblock %}</title>

  <!-- Tailwind (CDN for MVP — build tooling comes later, per blueprint §3) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX for dynamic interactions without a heavy SPA -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-5xl px-4 py-4 flex items-center justify-between">
      <a href="{{ url_for('web.index') }}" class="text-xl font-bold tracking-tight text-slate-900">
        CIRCLO
      </a>
      <span class="text-sm text-slate-500">Islamabad &amp; Rawalpindi</span>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="mx-auto max-w-5xl px-4 py-8 text-sm text-slate-400">
    &copy; {{ 2026 }} CIRCLO — peer-to-peer rentals.
  </footer>
</body>
</html>
