# CIRCLO local dev stack: web app + Postgres + MinIO.
# All configuration comes from .env (copy .env.example → .env first).
# Host ports are env-overridable so this still works if 5432/9000 are already
# in use on your machine.

services:
  app:
    build: .
    env_file: .env
    environment:
      # Consumed by the entrypoint's "wait for Postgres" step. These point at the
      # in-network service, independent of the host-side published ports.
      POSTGRES_HOST: postgres
      POSTGRES_PORT_INTERNAL: 5432
      FLASK_APP: wsgi.py
    ports:
      - "${APP_HOST_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-circlo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circlo}
      POSTGRES_DB: ${POSTGRES_DB:-circlo}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-circlo} -d ${POSTGRES_DB:-circlo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"           # S3 API
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
