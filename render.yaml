services:
  - type: web
    name: circlo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: circlo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_BUCKET_PRIVATE
        sync: false
      # --- Email (Brevo transactional API) + links in emails ---
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # --- Temporary: gated email smoke-test route ---
      - key: DEBUG_EMAIL_KEY
        sync: false
      - key: DEBUG_EMAIL_RECIPIENT
        sync: false
databases:
  - name: circlo-db
    plan: free
    databaseName: circlo
    user: circlo
